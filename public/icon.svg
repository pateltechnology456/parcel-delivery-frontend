<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="110" fill="#0b172e"/>
  <!-- Decorative subtle background glow -->
  <circle cx="360" cy="180" r="140" fill="#ff6b2c" opacity="0.18" filter="blur(50px)"/>
  <circle cx="160" cy="340" r="140" fill="#1154d9" opacity="0.25" filter="blur(50px)"/>
  
  <!-- 3 Skewed Bars Logo Mark Group -->
  <g transform="translate(145, 120)">
    <!-- Bar 1: Left Small Blue Bar -->
    <rect x="0" y="150" width="52" height="120" rx="14" fill="#3b82f6" opacity="0.8" transform="skewX(-18)"/>
    
    <!-- Bar 2: Middle Medium Blue Bar -->
    <rect x="75" y="75" width="52" height="195" rx="14" fill="#1154d9" transform="skewX(-18)"/>
    
    <!-- Bar 3: Right Tall Orange Bar -->
    <rect x="150" y="0" width="52" height="270" rx="14" fill="#ff6b2c" transform="skewX(-18)"/>
  </g>
</svg>